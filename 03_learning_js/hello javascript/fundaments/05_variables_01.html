<!DOCTYPE html>
<html>
    <head>
        <title>Variables</title>
    </head>
    <body>
        <script>
            let variable1 = 3;
            console.log(variable1);

            const calculation = 2 + 2;
            console.log(calculation);
            console.log(calculation + 2);

            const result = calculation + 2;
            console.log(result);

            const message = 'hello';
            console.log(message);
            
            //Asignarle un valor a una variable despuiés de haberla declarado cambia su valor, pero mantiene el del principio = reassign value
            //No usamos let por que crearía una nueva variable y solo queríamos cambiarle el valor. No podemos crear dos variables pero sí cambiarle el valor
            variable1 = 5;
            console.log(variable1);

            variable1 = variable1 + 1;
            console.log(variable1);
        </script> 
    </body>
</html>
