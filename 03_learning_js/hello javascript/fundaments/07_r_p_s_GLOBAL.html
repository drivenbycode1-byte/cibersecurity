<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissor</title>
    </head>
    <body>
        <p>Rock Paper Scissor</p>
        <button onclick="
                pick_computer_move();
                
                let result = '';
                if (computer_move === 'rock') {
                    result = 'Tie.'
                } else if (computer_move === 'paper') {
                    result = 'You lose.'
                } else if (computer_move === 'scissor') {
                    result = 'You won.'
                }
                
                alert(`You picked rock. Computer picked ${computer_move}. ${result}`);
            ">Rock</button>

        <button onclick="
                pick_computer_move();
                
                let result = '';
                if (computer_move === 'paper') {
                    result = 'Tie.'
                } else if (computer_move === 'scissor') {
                    result = 'You lose.'
                } else if (computer_move === 'rock') {
                    result = 'You won.'
                }
                
                alert(`You picked paper. Computer picked ${computer_move}. ${result}`);
            ">Paper</button>

        <button onclick="
                pick_computer_move();

                let result = '';
                if (computer_move === 'scissor') {
                    result = 'Tie.'
                } else if (computer_move === 'rock') {
                    result = 'You lose.'
                } else if (computer_move === 'paper') {
                    result = 'You won.'
                }
                
                alert(`You picked scissor. Computer picked ${computer_move}. ${result}`);
            ">Scissor</button>

        <script>
            let computer_move = '';     // Esta es una variable global

            function pick_computer_move() {
                const random_number = Math.random();   // Lo que está en esta función solo sirve para esta función. Si queremos usar el mismo código debemos re usarlo
                if (random_number >= 0 && random_number < 1 / 3) {
                    computer_move = 'rock';
                } else if (random_number >= 1 / 3 && random_number < 2 / 3) {
                    computer_move = 'paper';
                } else if (random_number >= 2 / 3 && random_number < 3) {
                    computer_move = 'scissor';
                }
            }
        </script> 
    </body>
</html>
