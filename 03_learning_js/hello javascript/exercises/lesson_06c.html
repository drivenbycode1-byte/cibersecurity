<!-- Aquí tenemos un ejercicios que nos dirá ¿condición? → entonces esto : si no, esto otro
-->
<!DOCTYPE html>
<html>
<head></head>
<body>
    <title>Coin-flip Game</title>

    <script>
        let random_number = Math.random(); 

        let result = random_number > 0.5 ? 'heads' : 'tails';  // 6j: convertir el if en ternario. 

        let guess = 'heads'; // Si la condición es verdadera → 'heads'  
        
        let message = guess === result ? 'You win!' : 'You lose!'; // 6j: otro ternario

        console.log(message);
        console.log(`Result: ${result}. Guess: ${guess}`);
    </script>

</body>
</html>
