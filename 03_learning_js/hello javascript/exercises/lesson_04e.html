<!--Create 2 buttons 'Add to cart' and 'Buy now'. Use CSS to give them
yellow and orange background colors:-->


<!DOCTYPE html>
<html>
    <head>
        <style>
            .Yellow {
                background-color: yellow;
            }
            .Orange{
                background-color: orange;
            }
        </style>
    </head>
    <body>
        <button class="Yellow">Add to cart</button>
        <br>
        <button class="Orange">Buy now</button>
    </body>
</html>
