<!--7a. Create a function called 'greet' that displays the message 'Hello!'
in the console. Call / run this function a few times using: greet();

7b. Continuing from 7a, add a parameter called 'name' to the 'greet'
function and display the message: 'Hello ${name}!'
Call the function a few times with different names: greet('Simon');

7c. Try calling greet() without a name (it will display 'Hello undefined!').
Modify the function so that if 'name' is undefined, it will display
'Hi there!' instead.

(Hint: use an if-statement. Since undefined is a falsy value, you
can use: if (!name) { ... } to check if 'name' is undefined).

7d. Create a function 'convertToFahrenheit(celsius)' that takes a number
in degrees Celsius and returns a number in degrees Fahrenheit.
· Formula: Fahrenheit = (Celsius * 9 / 5) + 32
. convertToFahrenheit(25) => 77

7e. Create a function 'convertToCelsius(fahrenheit)' that takes a number
in degrees Fahrenheit and returns a number in degrees Celsius.
· Formula: Celsius = (Fahrenheit - 32) * 5 / 9
. convertToCelsius(86) => 30

7f. Create a function 'convertTemperature(degrees, unit)' that takes a
number and a unit ('C' or 'F'), and converts it into the other unit.
. convertTemperature(25, 'C') => '77F'
. convertTemperature(86, 'F') => '30C'
Note: return a string, and try to reuse the functions from 7d and 7e.

7g. Create a function convertLength(length, from, to) that takes a
number and a unit ('km' or 'miles') and converts the length to another
unit ('km' or 'miles'). Note: 1 mile = 1.6 km (approximately).
. convertLength(50, 'miles', 'km') => '80 km'
. convertLength(32, 'km', 'miles') => '20 miles'
. convertLength(50, 'km', 'km') => '50 km'

7h. Update convertLength to support converting between km, miles,
and also feet. Note: 1 mile = 5280 ft, 1 km = 3281 ft (approximately).
. convertLength(5, 'miles', 'km') => '8 km'
. convertLength(5, 'miles', 'ft') => '26400 ft'
. convertLength(5, 'km', 'ft') => '16405 ft'

7i. Update convertLength so that if you give it an invalid unit, it will
return ` Invalid unit: ${unit}`.
. convertLength(5, 'lbs', 'lbs') => 'Invalid unit: Ibs'-->

<!DOCTYPE html>
<html>
    <title></title>
    <head></head>
    <body>
        <script>
            greet()

            convert_to_farenheit(25)

            convert_to_celsius(86)

            convert_temperature(25, 'C')
            convert_temperature(86, 'F')

            function greet(name) {
                if (!name) {
                    console.log('Hi there!');
                    return;                   // Este return detiene la función si se cumple. Si no ponemos es return la console.log se repite 2 veces
                }

                console.log(`Hello ${name}!`);
            }

            function convert_to_farenheit(celsius) {
                let farenheit = (celsius * 9 / 5) + 32;
                console.log(`The farenheit are ${farenheit}`);
                return farenheit;
            }

            function convert_to_celsius(farenheit) {
                let celsius = (farenheit - 32) * 5 / 9;
                console.log(`The celsius are ${celsius}`);
                return celsius;
            }

            function convert_temperature(degrees, unit) {
                if (unit === 'C') {
                    const farenheit = convert_to_farenheit(degrees);
                    return `${farenheit}F`;
                } else if (unit === 'F') {
                    const celsius = convert_to_celsius(degrees);
                    return `${celsius}C`;
                }
            }

            function convertLength(length, from, to) {

                // Validación de unidades (sin usar [])
                if (from !== 'km' && from !== 'miles' && from !== 'ft') {
                    return `Invalid unit: ${from}`;
                }

                if (to !== 'km' && to !== 'miles' && to !== 'ft') {
                    return `Invalid unit: ${to}`;
                }

                // Si las unidades son iguales
                if (from === to) {
                    return `${length} ${to}`;
                }

                // miles → km
                if (from === 'miles' && to === 'km') {
                    return `${length * 1.6} km`;
                }

                // miles → ft
                if (from === 'miles' && to === 'ft') {
                    return `${length * 5280} ft`;
                }

                // km → miles
                if (from === 'km' && to === 'miles') {
                    return `${length / 1.6} miles`;
                }

                // km → ft
                if (from === 'km' && to === 'ft') {
                    return `${length * 3281} ft`;
                }

                // ft → miles
                if (from === 'ft' && to === 'miles') {
                    return `${length / 5280} miles`;
                }

                // ft → km
                if (from === 'ft' && to === 'km') {
                    return `${length / 3281} km`;
                }
            }


        </script>
    </body>
</html>
