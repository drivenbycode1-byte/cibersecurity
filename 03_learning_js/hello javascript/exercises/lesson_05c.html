<!--50. When we click the '1' button:
. Add the string '1' to the calculation variable: calculation += '1';
. Display the calculation in the console: console.log(calculation);

5p. Do the same for the '2', '3', and '+' buttons (add ' + ' instead of '+').

5q. When we click the '=' button, use the code: eval(calculation);
(eval( ... ) converts the calculation string into actual math)
. Save the result back in 'calculation': calculation = eval(calculation);
. Display the result in the console: console.log(calculation);

5r. Create the rest of the buttons in the calculator. To create multiple rows
of buttons, put the buttons inside <p> elements like this:-->


<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
    </head>
    <body>
        <p>
            <button onclick="
                    calculation += '1'
                    console.log(calculation);
                ">1</button>
            <button onclick="
                    calculation = calculation + '2'
                    console.log(calculation);
                ">2</button>
            <button onclick="
                    calculation = calculation + '3'                                         
                    console.log(calculation);
                ">3</button>
            <button onclick="
                    calculation = calculation + ' + '
                    console.log(calculation);
                ">+</button>
        </p>
        <p>
            <button onclick="
                    calculation += '4'
                    console.log(calculation);
                ">4</button>
            <button onclick="
                    calculation = calculation + '5'
                    console.log(calculation);
                ">5</button>
            <button onclick="
                    calculation = calculation + '6'                                         
                    console.log(calculation);
                ">6</button>
            <button onclick="
                    calculation = calculation + ' - '
                    console.log(calculation);
                ">-</button>
        </p>
        
        <p>
            <button onclick="
                    calculation += '7'
                    console.log(calculation);
                ">7</button>
            <button onclick="
                    calculation = calculation + '8'
                    console.log(calculation);
                ">8</button>
            <button onclick="
                    calculation = calculation + '9'                                         
                    console.log(calculation);
                ">9</button>
            <button onclick="
                    calculation = calculation + ' * '
                    console.log(calculation);
                ">*</button>
        </p>

        <p>
            <button onclick="
                    calculation += '0'
                    console.log(calculation);
                ">0</button>
            <button onclick="
                    calculation = calculation + '.'
                    console.log(calculation);
                ">.</button>
            <button onclick="
                    calculation = eval(calculation)                                         
                    console.log(calculation);
                ">=</button>
            <button onclick="
                    calculation = calculation + ' / '
                    console.log(calculation);
                ">/</button>
        </p>

                <p>
            <button onclick="
                    calculation = ''
                    console.log('Cleared.');
                ">Clear</button>
        </p>


        <button onclick="
                calculation = eval(calculation)
                console.log(calculation);
            ">=</button>


        <script>

        </script> 
    </body>
</html>
